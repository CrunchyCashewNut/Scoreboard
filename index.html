    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Scoreboard</title>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="container">
            <div class="scoreboard">
                <h3 class="title">HOME</h3>
                <h1 class="display" id="display_home">0</h1>
                <div class="add_score">
                    <h3 class="action" onclick="homeAddOne()">+ 1</h3>
                    <h3 class="action" onclick="homeAddTwo()">+ 2</h3>
                    <h3 class="action" onclick="homeAddThree()">+ 3</h3>
                </div>
            </div>
            <div class="scoreboard">
                <h3 class="title">GUEST</h3>
                <h1 class="display" id="display_guest">0</h1>
                <div class="add_score">
                    <h3 class="action" onclick="guestAddOne()">+ 1</h3>
                    <h3 class="action" onclick="guestAddTwo()">+ 2</h3>
                    <h3 class="action" onclick="guestAddThree()">+ 3</h3>
                </div>
            </div>
        </div>
        <script src="index.js"></script>
        
    </body>
    </html>
